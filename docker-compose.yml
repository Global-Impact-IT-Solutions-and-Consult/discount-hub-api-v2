version: '3.8'

services:
  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    # volumes:
    #   - db:/data/db # specify the absolute path inside the container
    networks:
      - discount-hub-network

  redis:
    image: redis:latest
    ports:
      - '6379:6379'
    networks:
      - discount-hub-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

networks:
  discount-hub-network:
    driver: bridge

volumes:
  ollama_data:
  # db:
